  <body class="mcm-body">
<div id="root"><div class="customizer-root mcm-root"><div class="mcm-cart mcm-cart--press"><button type="button" class="mcm-cart-close mcm-cart-close--press" aria-label="Close cart"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m3.5 3.5 9 9M12.5 3.5l-9 9"></path></svg></button><div class="mcm-cart-press"><svg width="0" height="0" aria-hidden="true" style="position: absolute;"><defs><filter id="mcmGingerFX" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.085" numOctaves="5" seed="11" result="noise"></feTurbulence><feDiffuseLighting in="noise" surfaceScale="3.2" diffuseConstant="1.12" lighting-color="#FFE8C8" result="bump"><feDistantLight azimuth="225" elevation="52"></feDistantLight></feDiffuseLighting><feComposite in="bump" in2="SourceGraphic" operator="arithmetic" k1="0.85" k2="0.15" k3="0" k4="0" result="tex"></feComposite><feComposite in="tex" in2="SourceAlpha" operator="in"></feComposite></filter><filter id="mcmFloodFX" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blur"></feGaussianBlur><feDiffuseLighting in="blur" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#FFF4E6" result="dl"><feDistantLight azimuth="225" elevation="52"></feDistantLight></feDiffuseLighting><feComposite in="dl" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="body"></feComposite><feSpecularLighting in="blur" surfaceScale="2.2" specularConstant="0.14" specularExponent="4" lighting-color="#FFFCF6" result="spec"><feDistantLight azimuth="235" elevation="48"></feDistantLight></feSpecularLighting><feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"></feComposite><feComposite in="body" in2="spec2" operator="arithmetic" k1="0" k2="1" k3="0.42" k4="0" result="pool"></feComposite><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="5" result="grain"></feTurbulence><feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.5  0 0 0 0 0.46  0 0 0 0.05 0" result="grainA"></feColorMatrix><feBlend in="pool" in2="grainA" mode="soft-light" result="poolGrain"></feBlend><feComposite in="poolGrain" in2="SourceAlpha" operator="in" result="poolC"></feComposite><feDropShadow in="poolC" dx="1.2" dy="2" stdDeviation="2.2" flood-color="#3A2010" flood-opacity="0.22"></feDropShadow></filter><filter id="mcmPipeFX" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="blur"></feGaussianBlur><feDiffuseLighting in="blur" surfaceScale="4.2" diffuseConstant="1.24" lighting-color="#E87858" result="dl"><feDistantLight azimuth="225" elevation="54"></feDistantLight></feDiffuseLighting><feComposite in="dl" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="body"></feComposite><feSpecularLighting in="blur" surfaceScale="3.2" specularConstant="0.18" specularExponent="4.5" lighting-color="#FFC8B4" result="spec"><feDistantLight azimuth="235" elevation="50"></feDistantLight></feSpecularLighting><feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"></feComposite><feComposite in="body" in2="spec2" operator="arithmetic" k1="0" k2="1" k3="0.38" k4="0" result="beads"></feComposite><feComposite in="beads" in2="SourceAlpha" operator="in" result="beadsC"></feComposite><feDropShadow in="beadsC" dx="1.6" dy="2.6" stdDeviation="2.1" flood-color="#2E1206" flood-opacity="0.3"></feDropShadow></filter></defs></svg><div class="mcm-cart-press__stage"><div class="mcm-cart-press__cookie is-idle" role="button" tabindex="0" aria-label="Tap to pour icing" style="--mcm-invite-r: 87.04999999999991px;"><canvas class="mcm-cart-press__base" width="544" height="544"></canvas><canvas class="mcm-cart-press__flood" width="544" height="544"></canvas><canvas class="mcm-cart-press__pipe" aria-label="Trace the heart stencil" width="544" height="544"></canvas><div class="mcm-cart-press__invite" aria-hidden="true"></div><div class="mcm-cart-press__hint" aria-hidden="true" style="opacity: 1;">TAP TO POUR</div></div><div class="mcm-cart-press__copy" aria-live="polite"><p class="mcm-cart-press__title">Your cookies will land here. Meanwhile…</p><p class="mcm-cart-press__kicker">GO ON — TAP IT</p></div><div class="mcm-cart-press__actions" style="opacity: 0; pointer-events: none;"><button type="button" class="mcm-cart-press__pill is-accent">Start creating&nbsp;&nbsp;→</button><button type="button" class="mcm-cart-press__again">Practice again&nbsp;&nbsp;↺</button></div></div></div></div></div></div>
